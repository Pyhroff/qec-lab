name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  tests:
    name: QEC model tests (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run regression tests
        run: python -m pytest -q tests
      - name: Run reproducible resource-sweep smoke test
        run: |
          python -m qec.resource_sweep --output /tmp/qec-resource-sweep.json
          python - <<'PY'
          import json
          with open("/tmp/qec-resource-sweep.json", encoding="utf-8") as handle:
              report = json.load(handle)
          assert report["result_count"] == 18
          assert report["measurement_type"] == "analytical_model_sweep_not_hardware_measurement"
          assert report["code_revision"]
          print(f"Resource sweep passed: {report['result_count']} cases, {report['runtime_seconds']} seconds")
          PY
      - name: Run PQC evidence-to-QEC bridge smoke test
        run: |
          python -m qec.scenario_bridge tests/fixtures/quantum_collapse_scenario.json --n-logical 100 --t-gates 1000000 --output /tmp/qec-bridge.json
          python - <<'PY'
          import json
          with open("/tmp/qec-bridge.json", encoding="utf-8") as handle:
              report = json.load(handle)
          assert report["measurement_type"] == "conditional_analytical_resource_estimate_not_hardware_measurement"
          assert report["summary"]["supported_rsa_node_count"] == 1
          assert report["summary"]["unsupported_node_count"] == 1
          rows = {row["crypto"]: row for row in report["findings"]}
          assert rows["RSA"]["status"] == "estimated"
          assert rows["RSA"]["resource_estimate"]["n_logical"] == 100
          assert rows["ECC-P256"]["status"] == "unsupported_crypto_model"
          assert rows["ECC-P256"]["resource_estimate"] is None
          print("PQC-to-QEC bridge passed: RSA estimate scoped; ECC retained as unsupported evidence")
          PY
      - name: Compile Python sources
        run: python -m compileall -q .

